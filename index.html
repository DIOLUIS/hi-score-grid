<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insert Coin Arena | Hi-Score Grid</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-nav">
        <div class="logo">
            <h1>HI-SCORE<span class="neon-text">_GRID</span></h1>
        </div>
        <div class="user-profile">
            <span class="player-name">PLAYER_1</span>
            <span class="player-stars">⭐ 000</span>
        </div>
    </header>

    <main class="arena-container">
        
        <div class="arcade-header">
            <h2 class="arena-title">INSERT COIN ARENA <span class="badge">ARCADE</span></h2>
            <nav class="system-selector">
                <button class="system-tab active">CPS-1</button>
                <button class="system-tab">CPS-2</button>
                <button class="system-tab">CPS-3</button>
                <button class="system-tab">MVS (NEOGEO)</button>
            </nav>
        </div>

        <section id="drop-zone-section" class="cyber-panel">
            <div id="rom-drop-zone" class="drop-area">
                <i class="icon-insert-coin"></i>
                <h2 id="drop-title">SISTEMA ATIVO: CPS-1/CPS-2</h2>
                <p>Arraste o arquivo .zip do jogo aqui</p>
                <p class="sub-text">Validação de Hash Local Ativada</p>
                <input type="file" id="rom-input" accept=".zip" hidden>
                
                <div style="margin-top: 20px; display: flex; justify-content: center;">
                    <button id="btn-select-rom" class="btn-neon">SELECIONAR ARQUIVO</button>
                </div>
            </div>
        </section>

        <!-- Secção do Emulador -->
        <section id="emulator-section" class="cyber-panel hidden" style="display: flex; flex-direction: column; align-items: center;">
            <div id="game-canvas-container">
                <canvas id="emulator-canvas"></canvas>
            </div>
            
            <div class="emulator-controls">
                <!-- Botão agora fica disponível DURANTE a partida -->
                <button id="btn-toggle-shader" class="btn-neon">LIGAR SHADER CRT</button>
                <button id="btn-quit" class="btn-danger">ABORTAR MISSÃO</button>
                <button id="btn-fullscreen" class="btn-neon">TELA CHEIA</button>
            </div>
        </section>

        <section id="leaderboard-section" class="cyber-panel">
            <h2 class="section-title">GLOBAL_RANKING // ARCADE</h2>
            <table class="cyber-table">
                <thead>
                    <tr>
                        <th>RANK</th>
                        <th>JOGADOR</th>
                        <th>JOGO</th>
                        <th>SCORE</th>
                    </tr>
                </thead>
                <tbody id="ranking-data">
                    <tr class="top-1">
                        <td>1ST</td>
                        <td>UNKNOWN</td>
                        <td>SF2CE</td>
                        <td>999.999</td>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>

    <script src="input.js"></script>
    <script src="app.js"></script>
    
    <script type="module">
        import fbneo from './core/fbneo_libretro.js';

        fbneo({
            canvas: document.getElementById('emulator-canvas'),
            noInitialRun: true,
            locateFile: function(path) {
                if (path.endsWith('.wasm')) return 'core/' + path;
                return path;
            },
            print: function(text) { console.log("[FBNeo] " + text); },
            printErr: function(text) { console.error("[FBNeo] " + text); }
        }).then(function(instance) {
            console.log("[SYSTEM] Motor FBNeo inicializado e pronto!");
            window.CoreFS = instance.FS;
            window.CoreModule = instance;
        });
    </script>
</body>
</html>
